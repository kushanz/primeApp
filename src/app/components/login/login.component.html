<section class="login-page">
  <div class="login-shell">
    <a href="#" class="login-brand">
      <img class="login-brand__logo" src="assets/ng.png" alt="logo" />
      <span class="login-brand__name">Node Angular App</span>
    </a>
    <div class="login-card">
      <div class="login-card__inner">
        <div class="login-card__header">
          <p class="login-card__eyebrow">Welcome back</p>
          <h3 class="login-card__title">Sign in to your account</h3>
          <p class="login-card__subtitle">Continue with your email and password to access the dashboard.</p>
        </div>

        <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="login-field">
            <label for="email" class="login-field__label">Your Email</label>
            <input pInputText id="username" pSize="large" class="login-field__input w-full" formControlName="email" />
          </div>

          <div class="login-field">
            <label for="password" class="login-field__label">Password</label>
            <input pInputText id="password" type="password" pSize="large" class="login-field__input w-full" formControlName="password" />
          </div>

          <div class="login-form__meta">
            <div class="login-form__remember">
              <p-checkbox  value="remember" inputId="remember" />
              <label for="remember" class="login-form__remember-label">Remember me</label>
            </div>
            <a href="#" class="login-form__link">Forgot password?</a>
          </div>

          <p-button label="Sign In" styleClass="w-full login-form__button" type="submit" [loading]="authStore.loading()" [disabled]="loginForm.invalid"/>
          <p class="login-form__signup">
            Don’t have an account yet?
            <span routerLink="/register" class="login-form__signup-link">Sign up</span>
          </p>

        </form>
      </div>
    </div>
  </div>
</section>

<p-toast position="bottom-right"></p-toast>
