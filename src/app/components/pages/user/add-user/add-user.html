<div class="flex flex-col gap-4 h-[calc(100%-65px)]">
    <!-- <div class="font-semibold text-xl">Horizontal</div> -->
    <div class="grid grid-cols-12 gap-4">
        <label for="firstname" class="flex items-center col-span-12 mb-2 md:col-span-3 md:mb-0">First Name</label>
        <div class="col-span-12 md:col-span-9">
            <input pInputText id="firstname" type="text" class="w-full" />
        </div>
    </div>
    <div class="grid grid-cols-12 gap-4">
        <label for="lastname" class="flex items-center col-span-12 mb-2 md:col-span-3 md:mb-0">Last Name</label>
        <div class="col-span-12 md:col-span-9">
            <input pInputText id="lastname" type="text" class="w-full" />
        </div>
    </div>
    <div class="grid grid-cols-12 gap-4">
        <label for="email" class="flex items-center col-span-12 mb-2 md:col-span-3 md:mb-0">Email</label>
        <div class="col-span-12 md:col-span-9">
            <input pInputText id="email" type="text" class="w-full" />
        </div>
    </div>
    <div class="grid grid-cols-12 gap-4">
        <label for="password" class="flex items-center col-span-12 mb-2 md:col-span-3 md:mb-0">Password</label>
        <div class="col-span-12 md:col-span-9">
            <input pInputText id="password" type="password" class="w-full" autocomplete="new-password" />
        </div>
    </div>
    <!-- // add select field for user role as admin| user | manager -->
      <div class="grid grid-cols-12 gap-4">
        <label for="role" class="flex items-center col-span-12 mb-2 md:col-span-3 md:mb-0">Role</label>
        <div class="col-span-12 md:col-span-9">
            <p-select id="role" [options]="[{label:'Admin', value:'admin'}, {label:'User', value:'user'}, {label:'Manager', value:'manager'}]" optionLabel="label" placeholder="Select a role" class="w-full"></p-select>
        </div>
      </div>
</div>
<!-- footer: stays directly below content (no internal scroll) -->
<div class="pt-4 border-t border-gray-200 flex justify-end mt-4">
    <p-button label="Save" class="" />
</div>
