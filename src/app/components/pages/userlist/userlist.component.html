<header class="bg-white shadow-sm">
    <div class="flex h-16 items-center justify-between mx-auto px-4 py-4 sm:px-6 lg:px-8">
      <h1 class="text-3xl font-bold tracking-tight text-gray-900">Users</h1>
      <div class="card flex justify-center space-x-2">
          <input type="text" pInputText [(ngModel)]="searchText" [placeholder]="'Search user'" />
          <p-splitbutton label="New User" (onClick)="newUser()" [model]="items"outlined severity="secondary"  />
      </div>
    </div>
  </header>
  <main>
    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
      <!-- Your content -->
      @if(userLoading()) {
        <p-table [value]="fakeList()" [tableStyle]="{ 'min-width': '50rem' }">
            <ng-template pTemplate="header">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Type</th>
                    <th>Created At</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-fake>
                <tr>
                  <td><p-skeleton /></td>
                  <td><p-skeleton /></td>
                  <td><p-skeleton /></td>
                  <td><p-skeleton /></td>
                </tr>
            </ng-template>
        </p-table>
      } @else {
        <p-table [value]="userList()" [tableStyle]="{ 'min-width': '50rem' }">
            <ng-template pTemplate="header">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Type</th>
                    <th>Created At</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-user>
                <tr>
                    <td>{{ user.name }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.role }}</td>
                    <td>{{ user.createdAt | date}}</td>
                </tr>
            </ng-template>
        </p-table>
      
      }
      
    </div>
  </main>
